<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>3DGS 查看器</title>
  <link rel="stylesheet" href="/app.css">
  <script type="importmap">{"imports":{"three":"/vendor/three.module.min.js"}}</script>
</head>
<body>
  <header>
    <h1>3DGS 查看器</h1>
    <div class="toolbar-actions">
      <label id="mode-control" hidden>查看模式<select id="mode">
        <option value="compare">并排对比</option>
        <option value="disabled">关闭稠密化</option>
        <option value="enabled">开启稠密化</option>
      </select></label>
      <button id="home" disabled>重置视角</button>
    </div>
  </header>
  <main>
    <section id="viewport" aria-label="三维预览">
      <div id="compare-captions" hidden>
        <section id="disabled-caption"><h2>关闭稠密化</h2><p id="disabled-stats"></p></section>
        <section id="enabled-caption"><h2>开启稠密化</h2><p id="enabled-stats"></p></section>
        <section id="default-caption" hidden><h2>原演示模型</h2><p id="default-stats"></p></section>
      </div>
      <div class="frame-area">
        <img id="frame" alt="服务端渲染的 3DGS 场景" hidden>
        <div id="status" role="status">正在连接渲染服务…</div>
      </div>
    </section>
    <aside aria-label="渲染与性能参数">
      <section>
        <h2>当前场景</h2>
        <p id="scene">—</p>
      </section>
      <section>
        <h2>渲染参数</h2>
        <label>渲染模式<select id="renderer"><option value="native">原生融合算子</option><option value="tunable">可调 NPU 张量渲染</option></select></label>
        <p id="renderer-note">原生模式使用算子固定参数。</p>
        <fieldset id="advanced-options" disabled>
          <legend>高斯与高级参数</legend>
          <label>背景色<input id="opt-background" type="color" value="#000000"></label>
          <label>排序<select id="opt-sort"><option value="depth">相机深度</option><option value="radial">径向距离</option></select></label>
          <div id="numeric-options"></div>
          <button id="reset-options" type="button">恢复高级参数默认值</button>
        </fieldset>
        <label><span id="resolution-label">分辨率</span><select id="resolution">
          <option value="192x128">192 × 128</option><option value="256x160">256 × 160</option>
          <option value="320x192">320 × 192</option><option value="640x360" selected>640 × 360</option>
          <option value="960x540">960 × 540</option><option value="1280x720">1280 × 720</option>
          <option value="1920x1080">1920 × 1080</option>
        </select></label>
        <label>球谐阶数<select id="sh"></select></label>
        <label>请求频率上限<select id="fps"><option value="8">8 FPS</option><option value="15" selected>15 FPS</option><option value="24">24 FPS</option></select></label>
        <label>JPEG 质量 <output id="quality-out">85</output><input id="quality" type="range" min="50" max="95" value="85"></label>
        <label>视场角 <output id="fov-out">39°</output><input id="fov" type="range" min="25" max="80" value="39"></label>
      </section>
      <section>
        <h2>最近一帧</h2>
        <dl>
          <div><dt title="原生 Rasterizer 调用及同步，包含编排开销">服务端推理</dt><dd id="inference">—</dd></div>
          <div><dt title="设备事件之间的时间">NPU 事件</dt><dd id="npu">—</dd></div>
          <div><dt title="拷回 CPU 并编码 JPEG">回传准备</dt><dd id="prepare">—</dd></div>
          <div><dt title="浏览器发出请求到收到图像并解码">取帧到解码</dt><dd id="roundtrip">—</dd></div>
        </dl>
      </section>
    </aside>
  </main>
  <footer>左键拖动旋转 <span>·</span> 滚轮缩放 <span>·</span> 右键拖动平移 <span>·</span> R 重置视角</footer>
  <script type="module" src="/app.js"></script>
</body>
</html>
